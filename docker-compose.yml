services:
  helpdesk-agent:
    build: .
    container_name: it-helpdesk-agent
    ports:
      - "8000:8000"
    environment:
      - LOGS_DIR=/app/logs
      - LLM_PROVIDER=mock
      - TOKEN_BUDGET_LIMIT=4000
      - OPENAI_MODEL=gpt-4o-mini
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
